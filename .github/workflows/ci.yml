name: Validar sistema financeiro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m compileall -q config.py main.py src scripts tests

      - name: Validar template de contratos
        run: python -m scripts.importar_contas_receber --csv templates/contas_a_receber.csv --dry-run

      - name: Rodar testes de fluxo de caixa
        run: python tests/test_cashflow.py

      - name: Rodar testes de upload
        run: python tests/test_upload_utils.py

      - name: Rodar dry-run financeiro
        run: python tests/test_dry_run.py
